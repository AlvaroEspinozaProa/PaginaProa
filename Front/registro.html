<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuenta - Escuela PRoA</title>
    
    <link rel="stylesheet" href="proa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Contenedor Uiverse.io */
        .uiverse-card {
            max-width: 440px;
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
            border-radius: 28px;
            padding: 40px 35px;
            border: 4px solid #ffffff;
            box-shadow: 0 20px 40px -15px rgba(0, 87, 184, 0.18);
            text-align: center;
            position: relative;
        }

        .uiverse-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, #0057B8, #00AEEF);
            border-radius: 0 0 10px 10px;
        }

        .uiverse-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0, 119, 204, 0.2);
        }

        .uiverse-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0057B8;
            margin-bottom: 6px;
        }

        .uiverse-subheading {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 25px;
        }

        .uiverse-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #0077cc;
            font-size: 0.95rem;
        }

        .uiverse-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 14px 16px 14px 44px;
            border-radius: 16px;
            font-size: 0.92rem;
            color: #1e293b;
            box-shadow: 0 8px 12px -6px rgba(207, 240, 255, 0.6);
            transition: all 0.25s ease;
        }

        .uiverse-input:focus {
            outline: none;
            border-color: #00AEEF;
            box-shadow: 0 0 0 4px rgba(0, 174, 239, 0.15);
            background: #ffffff;
        }

        .uiverse-btn {
            width: 100%;
            font-weight: 700;
            background: linear-gradient(135deg, #0077cc 0%, #0057B8 100%);
            color: #ffffff;
            padding: 15px;
            margin-top: 10px;
            border-radius: 16px;
            border: none;
            font-size: 0.98rem;
            cursor: pointer;
            box-shadow: 0 12px 20px -8px rgba(0, 119, 204, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .uiverse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 25px -8px rgba(0, 119, 204, 0.5);
            background: linear-gradient(135deg, #0088e6 0%, #004494 100%);
        }

        .uiverse-btn:active {
            transform: translateY(0);
        }

        .mensaje-estado {
            margin-top: 15px;
            font-size: 0.88rem;
            font-weight: 600;
            min-height: 20px;
        }

        .login-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.88rem;
            color: #64748b;
        }

        .login-footer a {
            color: #0077cc;
            font-weight: 700;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/navigation.js" defer></script>
</head>
<body>

    <!-- Header global unificado -->
    <header id="global-header"></header>

    <div class="register-wrapper">
        <div class="uiverse-card">
            <img src="logo.png" alt="Logo PRoA" class="uiverse-logo">
            <h1 class="uiverse-heading">Crear Cuenta</h1>
            <p class="uiverse-subheading">Registro para estudiantes y empresas colaboradoras</p>

            <form id="formRegistro" class="uiverse-form">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input required class="uiverse-input" type="text" id="nombre" placeholder="Nombre completo o Empresa">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input required class="uiverse-input" type="email" id="email" placeholder="Correo electrónico">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input required class="uiverse-input" type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input required class="uiverse-input" type="password" id="confirmPassword" placeholder="Confirmar contraseña">
                </div>

                <button class="uiverse-btn" type="submit" id="btnRegister">
                    <i class="fa-solid fa-user-plus"></i> Registrarse
                </button>
            </form>

            <div id="mensaje" class="mensaje-estado"></div>

            <div class="login-footer">
                ¿Ya tienes una cuenta? <a href="sesion.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <!-- Script modular de registro -->
    <script type="module" src="./JS/registro.js"></script>
</body>
</html>
